<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>San Pablo BBQ - Nómina</title>
  <style>
    :root { --verde: #1E3A1E; --verde-claro: #4A8C4A; --rojo: #8B2020; --ambar: #C97A20; --crema: #FAF6EE; --gris-texto: #555; }
    body { font-family: sans-serif; background: var(--crema); margin: 0; padding-bottom: 80px; }
    .card { background: white; margin: 15px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); overflow: hidden; }
    .card-header { background: var(--verde); color: white; padding: 12px 15px; }
    .card-header h2 { margin: 0; font-size: 16px; }
    .card-body { padding: 15px; }
    .emp-card { display: flex; align-items: center; gap: 12px; padding: 12px; border-bottom: 1px solid #eee; }
    .emp-avatar { width: 45px; height: 45px; background: #ddd; border-radius: 50%; overflow: hidden; display: flex; align-items:center; justify-content:center; font-weight:bold; color:white; background: var(--verde-claro); }
    .emp-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .emp-info { flex: 1; }
    .emp-name { font-weight: bold; color: #333; }
    .emp-status { font-size: 12px; color: #888; }
    .btn { border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-bottom: 8px; }
    .btn-green { background: var(--verde); color: white; }
    .btn-gray { background: #eee; color: #666; }
    .btn-outline { background: transparent; border: 1px solid #ddd; }
    .btn-sm { padding: 5px 8px; font-size: 12px; width: auto; }
    .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; align-items:flex-end; z-index:1000; }
    .modal-overlay.open { display:flex; }
    .modal-sheet { background:white; width:100%; border-top-left-radius:20px; border-top-right-radius:20px; padding:20px; box-sizing:border-box; }
    #nav-bottom { position: fixed; bottom: 0; width: 100%; background: white; display: flex; border-top: 1px solid #ddd; padding: 10px 0; z-index: 100; }
    .nav-btn { flex: 1; border: none; background: none; display: flex; flex-direction: column; align-items: center; font-size: 10px; color: #888; }
    .nav-btn.active { color: var(--verde); }
    .nav-icon { font-size: 20px; margin-bottom: 4px; }
    #toast { position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:#333; color:white; padding:10px 20px; border-radius:20px; font-size:14px; display:none; z-index:2000; }
    #toast.show { display:block; }
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 12px; color: #777; margin-bottom: 4px; }
    .field input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ddd; border-radius: 8px; }
    .page { display: none; }
    .page.active { display: block; }
  </style>
</head>
<body>

<div id="app">
  <div id="toast"></div>

  <div id="page-inicio" class="page active">
    <div class="card">
      <div class="card-header"><h2>🏠 Resumen General</h2></div>
      <div class="card-body">
        <p>Tarifa Lunes-Viernes: <b id="display-lv">$0</b></p>
        <p>Tarifa Sáb-Dom-Fest: <b id="display-sd">$0</b></p>
      </div>
    </div>
  </div>

  <div id="page-empleados" class="page">
    <div class="card">
      <div class="card-header" style="display:flex; justify-content:space-between; align-items:center;">
        <h2>👥 Mis Empleados</h2>
        <button class="btn btn-green btn-sm" onclick="openModalNuevoEmp()">+ Nuevo</button>
      </div>
      <div id="emp-lista"></div>
    </div>
  </div>

  <div id="page-config" class="page">
    <div class="card">
      <div class="card-header"><h2>💰 Tarifas por Hora</h2></div>
      <div class="card-body">
        <div class="field">
          <label>Lunes a Viernes</label>
          <input type="number" id="cfg-tarifa-lv">
        </div>
        <div class="field">
          <label>Sábados y Domingos</label>
          <input type="number" id="cfg-tarifa-sd">
        </div>
        <button class="btn btn-green" onclick="guardarTarifas()">💾 Guardar Tarifas</button>
      </div>
    </div>
  </div>

  <nav id="nav-bottom">
    <button class="nav-btn active" onclick="showPage('inicio')"><span>🏠</span>Inicio</button>
    <button class="nav-btn" onclick="showPage('empleados')"><span>👥</span>Personal</button>
    <button class="nav-btn" onclick="showPage('config')"><span>⚙️</span>Config</button>
  </nav>
</div>

<div class="modal-overlay" id="modal-nuevo-emp" onclick="closeModal('modal-nuevo-emp')">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-title">➕ Nuevo Empleado</div>
    <div class="field">
      <label>Nombre completo</label>
      <input type="text" id="nuevo-emp-nombre">
    </div>
    <div class="field">
      <label>Foto</label>
      <div id="nueva-foto-btn" onclick="document.getElementById('nueva-foto-input').click()" style="width:60px; height:60px; background:#eee; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer;">📷</div>
      <input type="file" id="nueva-foto-input" accept="image/*" capture="camera" style="display:none" onchange="previewNuevaFoto(this)">
    </div>
    <button class="btn btn-green" onclick="agregarEmpleado()">✅ Crear</button>
    <button class="btn btn-gray" onclick="closeModal('modal-nuevo-emp')">Cancelar</button>
  </div>
</div>

<script>
// --- LÓGICA DE NAVEGACIÓN ---
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  if(id === 'inicio') renderInicio();
  if(id === 'empleados') renderEmpleados();
  if(id === 'config') initConfig();
}

// --- BASE DE DATOS LOCAL ---
const getEmpleados = () => JSON.parse(localStorage.getItem('spbbq_empleados') || '[]');
const saveEmpleados = (data) => localStorage.setItem('spbbq_empleados', JSON.stringify(data));
const getTarifas = () => JSON.parse(localStorage.getItem('spbbq_tarifas') || '{"lv":7700, "sd":9000}');

// --- FUNCIONES EMPLEADOS ---
function renderEmpleados() {
  const emps = getEmpleados();
  const lista = document.getElementById('emp-lista');
  lista.innerHTML = '';
  emps.forEach((emp, index) => {
    const div = document.createElement('div');
    div.className = 'emp-card';
    div.innerHTML = `
      <div class="emp-avatar">${emp.foto ? <img src="${emp.foto}"> : '👤'}</div>
      <div class="emp-info">
        <div class="emp-name">${emp.nombre}</div>
        <div class="emp-status">ID: ${emp.id}</div>
      </div>
      <button class="btn btn-outline btn-sm" style="border-color:#8B2020; color:#8B2020" onclick="eliminarEmpleado(${emp.id})">🗑️ Borrar</button>
    `;
    lista.appendChild(div);
  });
}

function agregarEmpleado() {
  const nombre = document.getElementById('nuevo-emp-nombre').value;
  if(!nombre) return toast("Escribe un nombre");
  const emps = getEmpleados();
  const id = Date.now();
  emps.push({id, nombre, foto: nuevaFotoData});
  saveEmpleados(emps);
  closeModal('modal-nuevo-emp');
  renderEmpleados();
  toast("✅ Agregado");
}

function eliminarEmpleado(id) {
  if(confirm("¿Borrar este empleado?")) {
    let emps = getEmpleados();
    emps = emps.filter(e => e.id !== id);
    saveEmpleados(emps);
    renderEmpleados();
    toast("🗑️ Eliminado");
  }
}

// --- CONFIGURACIÓN ---
function initConfig() {
  const t = getTarifas();
  document.getElementById('cfg-tarifa-lv').value = t.lv;
  document.getElementById('cfg-tarifa-sd').value = t.sd;
}

function guardarTarifas() {
  const lv = document.getElementById('cfg-tarifa-lv').value;
  const sd = document.getElementById('cfg-tarifa-sd').value;
  localStorage.setItem('spbbq_tarifas', JSON.stringify({lv, sd}));
  toast("✅ Tarifas guardadas");
  setTimeout(() => { location.reload(); }, 800);
}

function renderInicio() {
  const t = getTarifas();
  document.getElementById('display-lv').innerText = $${t.lv};
  document.getElementById('display-sd').innerText = $${t.sd};
}

// --- CÁMARA ---
let nuevaFotoData = null;
function previewNuevaFoto(input) {
  if (input.files && input.files[0]) {
    const reader = new FileReader();
    reader.onload = e => {
      nuevaFotoData = e.target.result;
      document.getElementById('nueva-foto-btn').style.backgroundImage = url(${e.target.result});
      document.getElementById('nueva-foto-btn').style.backgroundSize = 'cover';
      document.getElementById('nueva-foto-btn').innerText = '';
    };
    reader.readAsDataURL(input.files[0]);
  }
}

// --- UTILIDADES ---
function openModalNuevoEmp() { document.getElementById('modal-nuevo-emp').classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function toast(m) { 
  const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

window.onload = () => { renderInicio(); };
</script>
</body>
</html>
